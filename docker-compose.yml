# PostgreSQL + la API de Nopar.
#
#   docker compose up --build -d     # construye la imagen y arranca todo
#   docker compose logs -f api       # ver el log de la API
#   docker compose down              # parar (los datos y las fotos se conservan en volúmenes)
#
# Con HTTPS (en un servidor con dominio propio): añade NOPAR_DOMAIN al .env y arranca con el perfil https, que
# levanta además Caddy delante de la API y gestiona solo el certificado (ver DESPLIEGUE.md):
#   docker compose --profile https up --build -d
#
# Con copias de seguridad automáticas (base de datos y fotos, en ./backups): añade el perfil backup (se pueden
# combinar: --profile https --profile backup). Ver DESPLIEGUE.md para restaurar:
#   docker compose --profile backup up -d
#
# Las variables salen del fichero .env de esta carpeta, el mismo que usa la aplicación en local (ver .env.example).
# POSTGRES_PASSWORD solo se aplica al crear el volumen la primera vez: cambiar DB_PASSWORD después no cambia
# la contraseña de la base de datos ya creada.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleet_db
      POSTGRES_USER: postgres # la aplicación se conecta con este usuario (application.yaml)
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el fichero .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleet_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/fleet_db
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el fichero .env}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el fichero .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-30}
      LOGIN_RATE_LIMIT_ENABLED: ${LOGIN_RATE_LIMIT_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-true}
      SHOW_SQL: ${SHOW_SQL:-false}
      WAVE_CALL_ACK_WINDOW_MINUTES: ${WAVE_CALL_ACK_WINDOW_MINUTES:-60}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      # Ruta dentro del contenedor: la carpeta ./secrets se monta en /run/secrets/nopar (ver .env.example)
      FCM_CREDENTIALS_FILE: /run/secrets/nopar/firebase-service-account.json
    volumes:
      - uploads:/data/uploads
      - ./secrets:/run/secrets/nopar:ro

  # HTTPS opcional: solo arranca con --profile https. Caddy pide y renueva el certificado de NOPAR_DOMAIN por sí solo
  # (el dominio tiene que apuntar a este servidor y los puertos 80 y 443 estar abiertos) y reenvía a la API.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      NOPAR_DOMAIN: ${NOPAR_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # los certificados: se conservan entre reinicios
      - caddy-config:/config

  # Copias de seguridad opcionales: solo arranca con --profile backup. Al arrancar y después cada BACKUP_EVERY_HOURS horas
  # guarda en ./backups la base de datos (db-*.dump, formato de pg_restore) y las fotos (uploads-*.tar.gz), y borra las
  # que tengan más de BACKUP_KEEP_DAYS días. Cada fichero se escribe con nombre temporal y se renombra al terminar, así
  # que una copia a medias nunca parece válida. Copia ./backups fuera del servidor: aquí solo protege de un fallo lógico.
  backup:
    image: postgres:17-alpine
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el fichero .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
    volumes:
      - uploads:/data/uploads:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          stamp=$$(date +%Y-%m-%d_%H%M)
          echo "[backup] $$stamp: copiando la base de datos y las fotos"
          if pg_dump -h db -U postgres -d fleet_db -Fc -f "/backups/db-$$stamp.dump.tmp" \
              && mv "/backups/db-$$stamp.dump.tmp" "/backups/db-$$stamp.dump"; then
            echo "[backup] base de datos: OK"
          else
            echo "[backup] ERROR en la copia de la base de datos"; rm -f "/backups/db-$$stamp.dump.tmp"
          fi
          if tar czf "/backups/uploads-$$stamp.tar.gz.tmp" -C /data/uploads . \
              && mv "/backups/uploads-$$stamp.tar.gz.tmp" "/backups/uploads-$$stamp.tar.gz"; then
            echo "[backup] fotos: OK"
          else
            echo "[backup] ERROR en la copia de las fotos"; rm -f "/backups/uploads-$$stamp.tar.gz.tmp"
          fi
          find /backups -type f \( -name 'db-*.dump' -o -name 'uploads-*.tar.gz' \) -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep $$((BACKUP_EVERY_HOURS * 3600))
        done

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
