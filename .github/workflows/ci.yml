name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior que siga en marcha
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Los tests que necesitan base de datos (NoparApplicationTests y PostgresIntegrationTest) levantan su propio
    # PostgreSQL con Testcontainers, para lo que el runner ya trae Docker: no hace falta un servicio Postgres ni
    # variables como DB_PASSWORD o JWT_SECRET.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # En Git, mvnw está registrado sin permiso de ejecución
      - name: Dar permiso de ejecución al wrapper de Maven
        run: chmod +x mvnw

      # verify ejecuta todos los tests y comprueba que el jar se empaqueta
      - name: Compilar y probar
        run: ./mvnw -B verify

  docker-image:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      # Comprueba que el Dockerfile construye (no se publica en ningún registro)
      - name: Construir la imagen
        run: docker build -t nopar:ci .
