name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior que siga en marcha
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # NoparApplicationTests arranca la aplicación contra un PostgreSQL en localhost:5432/fleet_db (como en local).
    # Los tests de integración levantan el suyo con Testcontainers, para lo que el runner ya trae Docker.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fleet_db
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fleet_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_PASSWORD: postgres
      # Clave solo para el CI (Base64 de 37 bytes); la de verdad nunca va en el repositorio
      JWT_SECRET: bm9wYXItY2ktb25seS1zaWduaW5nLWtleS0wMTIzNDU2Nzg5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # En Git, mvnw está registrado sin permiso de ejecución
      - name: Dar permiso de ejecución al wrapper de Maven
        run: chmod +x mvnw

      # verify ejecuta todos los tests y comprueba que el jar se empaqueta
      - name: Compilar y probar
        run: ./mvnw -B verify

  docker-image:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      # Comprueba que el Dockerfile construye (no se publica en ningún registro)
      - name: Construir la imagen
        run: docker build -t nopar:ci .
