server:
  port: 8080

spring:
  config:
    import: optional:file:./.env[.properties]

  application:
    name: Nopar

  datasource:
    url: jdbc:postgresql://localhost:5432/fleet_db
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# Configuración JWT anidada correctamente en YAML
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 86400000