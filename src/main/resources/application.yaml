server:
  # Railway (y otras plataformas) indican el puerto en PORT; sin esa variable, el 8080 de siempre
  port: ${PORT:8080}
  # Detrás de un proxy inverso (Caddy, ver docker-compose) la IP real del cliente llega en X-Forwarded-For; sin esto
  # el límite de intentos de login vería siempre la IP del proxy. Solo se aceptan esas cabeceras de proxies internos
  forward-headers-strategy: native

spring:
  config:
    import: optional:file:./.env[.properties]

  application:
    name: Nopar

  datasource:
    # DB_URL permite apuntar a otra base (p. ej. una vacia para probar las migraciones)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleet_db}
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway es el dueño del esquema: Hibernate solo comprueba que las entidades coinciden con él
      ddl-auto: validate
    # Sin sesión abierta durante el render de la respuesta: toda lectura de relaciones perezosas
    # ocurre dentro del servicio (transacción) o se trae con @EntityGraph
    open-in-view: false
    # Imprime en el log cada sentencia SQL: útil para depurar en local, ruidoso (y con datos) en producción.
    # SHOW_SQL=true/false lo cambia en cualquier entorno; docker-compose lo desactiva por defecto
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  flyway:
    # La BD que ya existía (creada antes con ddl-auto=update) se toma como la versión 1 del esquema;
    # en una BD vacía se ejecutan todas las migraciones desde V1
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# Configuración propia de la aplicación
application:
  storage:
    # Carpeta donde se guardan las fotos de las inspecciones (en producción, una ruta fuera del proyecto)
    location: uploads/inspections
  bootstrap:
    admin:
      # Solo se usan si no existe ningún administrador; tras el primer arranque pueden quitarse
      username: ${ADMIN_USERNAME:}
      password: ${ADMIN_PASSWORD:}
    super-admin:
      # El super administrador puede desactivar y reactivar cuentas. Se crea si no existe ninguno; si el usuario ya
      # es administrador, se le da el rango sin tocar su contraseña. Tras el primer arranque pueden quitarse
      username: ${SUPER_ADMIN_USERNAME:}
      password: ${SUPER_ADMIN_PASSWORD:}
  chat:
    retention:
      # Los mensajes del chat de las olas, y sus fotos, de hace más de estos días se borran solos cada noche
      # (CHAT_RETENTION_DAYS=0 lo desactiva y conserva todo). Cron de 6 campos (segundos incluidos) en la zona
      # indicada; "-" también lo desactiva
      days: ${CHAT_RETENTION_DAYS:30}
      cron: "0 45 3 * * *"
      zone: Europe/Madrid
  fleet:
    nightly-reset:
      # Red de seguridad: a esta hora los vehículos que siguen IN_USE (nadie los devolvió) pasan a AVAILABLE.
      # Cron de 6 campos (segundos incluidos) en la zona indicada; "-" lo desactiva
      cron: "0 0 4 * * *"
      zone: Europe/Madrid
  wave-calls:
    # Cuánto tiempo, desde que se llama a una ola, pueden los conductores pulsar «Enterado». Pasado ese rato la orden
    # caduca: ya no se puede confirmar y la app deja de insistir
    acknowledge-window-minutes: ${WAVE_CALL_ACK_WINDOW_MINUTES:60}
  push:
    fcm:
      # Notificaciones push con Firebase Cloud Messaging. Desactivado por defecto: sin credenciales no se envía nada y el
      # resto de la aplicación funciona igual. Para activarlo: FCM_ENABLED=true y las credenciales de la cuenta de
      # servicio de Firebase (de ellas salen el proyecto y la clave), de una de estas dos formas: FCM_CREDENTIALS_FILE
      # con la ruta del JSON, o FCM_CREDENTIALS_JSON con el propio JSON (o su Base64) donde no hay ficheros secretos,
      # como en Railway. Si están las dos, manda el fichero. Si está activado y las credenciales no se pueden leer, la
      # aplicación no arranca
      enabled: ${FCM_ENABLED:false}
      credentials-file: ${FCM_CREDENTIALS_FILE:}
      credentials-json: ${FCM_CREDENTIALS_JSON:}
  security:
    refresh-token-cleanup:
      # Borra los refresh tokens caducados (la tabla crece con cada inicio de sesión).
      # Cron de 6 campos (segundos incluidos) en la zona indicada; "-" lo desactiva
      cron: "0 30 3 * * *"
      zone: Europe/Madrid
    login-rate-limit:
      # Frena la prueba de contraseñas: tras max-attempts fallos de un usuario desde una IP (o max-attempts-per-account
      # desde cualquiera, o max-attempts-per-ip de una IP) se bloquea el login window-minutes minutos (429)
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      max-attempts: 5
      max-attempts-per-account: 20
      max-attempts-per-ip: 50
      window-minutes: 15
    cors:
      # Orígenes desde los que el cliente web puede llamar a la API, separados por comas (admite patrones como
      # http://localhost:*). Vacío = ninguno. Android e iOS no lo necesitan
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    jwt:
      secret-key: ${JWT_SECRET}
      # 15 minutos: la sesión larga la mantiene el refresh token (7 días)
      expiration: 900000

# Documentación OpenAPI: contrato en /v3/api-docs y Swagger UI en /swagger-ui.html (ambos sin autenticación).
# En producción conviene desactivarla con OPENAPI_ENABLED=false
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}